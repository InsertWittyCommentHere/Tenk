[project]
name = "equity-research"
version = "0.1.0"
description = "Production-grade AI investment research platform. Phase 1: SEC EDGAR data spine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.4",
    "platformdirs>=4.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "anthropic>=0.109.2",
    "fastapi>=0.137.1",
    "uvicorn>=0.49.0",
]

[project.scripts]
equity = "equity_research.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_research"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
